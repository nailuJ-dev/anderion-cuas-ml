name: Simulator integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spectra-sim-golden-path:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout C-UAS SDK
        uses: actions/checkout@v4
        with:
          path: sdk
      - name: Checkout spectra-sim
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/spectra-sim
          ref: ${{ vars.SPECTRA_SIM_REF || 'main' }}
          path: sim
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.85'
      - name: Generate radar and ISAC scenarios
        working-directory: sim
        run: cargo run --release -- cuas examples/scenarios/cuas_drone_isac.json --out "$RUNNER_TEMP/sim-cuas"
      - name: Run radar Golden Path
        working-directory: sdk
        run: |
          cargo run --release --bin cuas-golden-demo -- \
            --training demo-data/golden-path/training.json \
            --evaluation demo-data/golden-path/evaluation.json \
            --scenario "$RUNNER_TEMP/sim-cuas/cuas_scenario.json" \
            --output "$RUNNER_TEMP/cuas-radar-result.json"
      - name: Run 5G-MIMO/ISAC Golden Path
        working-directory: sdk
        run: |
          cargo run --release --bin cuas-golden-demo -- \
            --training demo-data/golden-path/training.json \
            --evaluation demo-data/golden-path/evaluation.json \
            --scenario "$RUNNER_TEMP/sim-cuas/cuas_isac_scenario.json" \
            --output "$RUNNER_TEMP/cuas-isac-result.json"
      - name: Validate result JSON
        run: |
          python - <<'PY'
          import json, os
          for name in ('cuas-radar-result.json','cuas-isac-result.json'):
              d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],name)))
              assert d['report']['components']
              assert d['replay'] in ('Exact','DecisionEquivalent')
              assert d['note']
          PY
